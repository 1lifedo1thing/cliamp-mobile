name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v0.0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unpin the local JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}"           >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release signed with the" \
                 "debug key cannot be installed over a previous release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > cliamp-release.jks

      - run: chmod +x gradlew

      - name: Build signed release
        env:
          KEYSTORE_FILE: cliamp-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CLIAMP_VERSION: ${{ steps.v.outputs.name }}
          # monotonic, so every release installs over the last one
          CLIAMP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # A debug-signed APK is the failure this whole pipeline exists to avoid,
      # so refuse to publish one rather than discovering it on someone's phone.
      - name: Verify signature
        id: sig
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          cat certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is debug signed; refusing to publish."
            exit 1
          fi
          FP=$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Stage artifact
        id: art
        run: |
          OUT="cliamp-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Android radio player for cliamp radio and the radio-browser directory.

          | | |
          | --- | --- |
          | Version | \`${{ steps.v.outputs.name }}\` (code ${{ github.run_number }}) |
          | Min Android | 8.0 (API 26) |
          | SHA-256 | \`${{ steps.art.outputs.sha256 }}\` |
          | Signing key | \`${{ steps.sig.outputs.fingerprint }}\` |

          The signing key is stable across releases, so this installs over an
          earlier build. Sideload it, or \`adb install -r ${{ steps.art.outputs.apk }}\`.
          EOF
          gh release create "${{ steps.v.outputs.tag }}" \
            "${{ steps.art.outputs.apk }}" \
            --title "cliamp ${{ steps.v.outputs.name }}" \
            --notes-file notes.md
